# The Android app's release build, unsigned. The release key is never on GitHub: android/tools/sign.sh signs the
# APK on the maintainer's machine, adds it to the release and publishes it.
#
#   tag android-v<version>   the build, then a draft release of that tag holding the unsigned APK and its SHA-256.
#                            The version must be appVersion in android/app/build.gradle.kts
#   run by hand              (Actions tab, or `gh workflow run android-release.yml --ref BRANCH`) the build only:
#                            the APK is kept with the run for two weeks, to compare with a build made elsewhere
#                            (android/tools/compare_apks.py)
#   a pull request that changes this file or the build's scripts: the build only, as run by hand
#
# Two jobs, so that the one that may write releases runs none of the repo's code: `build` has a read-only token
# and does everything the repo says; `draft` checks out nothing, and only hands the build's two files to GitHub.
#
# Each action is pinned to the commit of its release, named in the comment beside it.
name: Android release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-release.yml"
      - "android/tools/build_release.sh"
      - "android/tools/apk_checks.sh"

permissions:
  contents: read

# Never cancelled: a release build is seen through. A second run for the same tag waits for the first.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked before the build, so that a tag for the wrong version fails at once.
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^val appVersion = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::no appVersion of the form major.minor.patch in app/build.gradle.kts"
            exit 1
          fi
          if [ "$EVENT" = push ] && [ "$TAG" != "android-v$version" ]; then
            echo "::error::the tag $TAG is not the app's version $version: its tag is android-v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      # Reads the cache that the checks' runs on main write; a release run writes none.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Bench image
        working-directory: headunit
        run: python3 tools/bench.py image

      # The script a release is built with by hand, so that the two make the same file: the tests, the real agent's
      # included, then the unsigned release build and its checks. It leaves the APK and its SHA-256 in release/.
      - name: Tests and release build
        env:
          NBT_REQUIRE_BENCH: "1"
        run: tools/build_release.sh

      - name: The APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          file=release/nbtapps-$VERSION-unsigned.apk
          if [ ! -f "$file" ]; then
            echo "::error::the build left no $file"
            exit 1
          fi
          echo "${file#release/}, $(wc -c < "$file") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 \`$(cut -d ' ' -f 1 "$file.sha256")\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nbtapps-${{ steps.version.outputs.version }}-unsigned
          path: |
            android/release/nbtapps-${{ steps.version.outputs.version }}-unsigned.apk
            android/release/nbtapps-${{ steps.version.outputs.version }}-unsigned.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  draft:
    name: Draft release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: out
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nbtapps-${{ needs.build.outputs.version }}-unsigned
          path: out

      # A release that is already there for the tag, published or a draft, is left as it is: a tag goes out once.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          file=nbtapps-$VERSION-unsigned.apk
          sha256sum -c "$file.sha256"
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            echo "::error::there is already a release, or a draft of one, for $TAG"
            exit 1
          fi
          {
            run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            echo "Unsigned build of $COMMIT, from the workflow run $run."
            echo
            echo "$file SHA-256: \`$(cut -d ' ' -f 1 "$file.sha256")\`"
            echo
            echo "Not published yet: android/tools/sign.sh $VERSION signs it, adds nbtapps-$VERSION.apk and publishes."
          } > ../notes.md
          gh release create "$TAG" --draft --verify-tag --title "NBTApps $VERSION" --notes-file ../notes.md \
            "$file" "$file.sha256"
